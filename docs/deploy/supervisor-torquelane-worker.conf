; Queue worker for the TorqueLane API (staging).
; Install: sudo cp to /etc/supervisor/conf.d/torquelane-api-staging-worker.conf,
; replace SITE_USER and DEPLOY_PATH, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; It runs from `current`, so a deploy's `artisan reload` (queue:restart) makes
; each worker exit after its job and supervisor restarts it on the new release.

[program:torquelane-api-staging-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 DEPLOY_PATH/current/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=DEPLOY_PATH/current
user=SITE_USER
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=DEPLOY_PATH/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
