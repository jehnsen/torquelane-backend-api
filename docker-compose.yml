# Local development services. PHP runs on the host; see CLAUDE.md "Running it".
#
#   docker compose up -d --wait     (composer setup does this)
#
# POSTGRES_VERSION must match the major version of the staging/production
# server (`select version();` on DB_HOST). Supabase projects created since
# 2025 run Postgres 17; older ones may still be on 15.

name: torquelane-api

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    # Parallel Pest workers each `migrate:fresh` their own database, which drops every table
    # (and so locks every index and constraint) in one statement. The default 64 locks per
    # transaction runs the cluster's shared lock table dry once the schema passes ~70 tables.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: torquelane
      POSTGRES_PASSWORD: torquelane
      POSTGRES_DB: torquelane
    ports:
      # 54320, not 5432, so a Postgres already installed on the host doesn't collide.
      - "${FORWARD_DB_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torquelane -d torquelane"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  postgres-data:
